services:
  setup:
    build:
      context: .
      dockerfile: Dockerfile.setup
    volumes:
      # Bind mount host data directory
      - ../data:/data
    environment:
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-/data/transactions.db}
      - PARQUET_FILE_PATH=${PARQUET_FILE_PATH:-/data/test_1m_snappy.parquet}

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Bind to localhost for secure coding guidelines (prevents public network exposure)
      - "127.0.0.1:8000:8000"
    volumes:
      # Bind mount host data directory
      - ../data:/data
      # Persist pipeline quarantine and results outside the container
      - ./quarantine:/app/quarantine
      - ./results:/app/results
    environment:
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-/data/transactions.db}
      - PARQUET_FILE_PATH=${PARQUET_FILE_PATH:-/data/test_1m_snappy.parquet}
      - CACHE_TTL=${CACHE_TTL:-60}
      - ANOMALY_DEFAULT_THRESHOLD=${ANOMALY_DEFAULT_THRESHOLD:-5}
    depends_on:
      setup:
        condition: service_completed_successfully
